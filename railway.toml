# Despliegue en Railway.
#
# HOST=0.0.0.0 es obligatorio: sin eso uvicorn escucha solo dentro del
# contenedor y el enrutador de Railway no alcanza el proceso. El puerto lo
# inyecta la plataforma en $PORT y `run.py` ya lo lee.
#
# IMPORTANTE — una sola réplica. La base es SQLite sobre un volumen; dos
# instancias escribiendo el mismo archivo lo corrompen.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python run.py --host 0.0.0.0"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
healthcheckPath = "/health"
healthcheckTimeout = 60
